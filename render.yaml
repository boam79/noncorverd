services:
  - type: web
    name: noncorverd-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_OPENDATA_TOKEN
        sync: false
      - key: api_key
        sync: false
      - key: CORS_ORIGINS
        value: https://noncorverd.vercel.app
      - key: ADMINISTRATIVE_CODE_SERVICE_KEY
        sync: false
      - key: HIRA_SERVICE_KEY
        sync: false
      - key: HIRA_PRICING_SERVICE_KEY
        sync: false
